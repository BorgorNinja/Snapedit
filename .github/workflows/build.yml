name: Build, Test & Release APK

on:
  push:
    branches: [ "main", "master" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build, Emulator Test & Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9

      - name: Make Gradlew Executable
        run: chmod +x gradlew

      - name: Build APKs (Release, Debug & Instrumented Test APK)
        run: ./gradlew assembleRelease assembleDebug assembleDebugAndroidTest --no-daemon --stacktrace

      - name: Prepare APK Output
        run: |
          mkdir -p out/test-artifacts
          cp app/build/outputs/apk/release/app-release.apk out/Snapedit-Release.apk
          cp app/build/outputs/apk/debug/app-debug.apk out/Snapedit-Debug.apk
          cp out/Snapedit-Release.apk out/Snapedit.apk

      - name: Enable KVM Hardware Acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run Automated Emulator Tests (All 43 Tools, UI Flows, Image Upload & Release APK Smoke Test)
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: default
          arch: x86_64
          profile: pixel_6
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: |
            adb wait-for-device
            adb shell input keyevent 82
            adb logcat -c
            echo "=== [1/3] Installing Debug & Test APKs for Automated Feature & UI Suite ==="
            adb install -r app/build/outputs/apk/debug/app-debug.apk
            adb install -r app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk
            echo "=== [2/3] Running SnapEditAutomatedTest (All 43 Tools, Looks, Presets, Image Upload, Full UI & Export) ==="
            adb shell am instrument -w app.snapedit.test/androidx.test.runner.AndroidJUnitRunner > out/test-artifacts/instrumented-test-output.txt 2>&1
            cat out/test-artifacts/instrumented-test-output.txt
            grep -q "OK (2 tests)" out/test-artifacts/instrumented-test-output.txt && echo "Instrumented test suite PASSED" || { adb logcat -d *:E > out/test-artifacts/logcat-errors.txt; adb exec-out screencap -p > out/test-artifacts/failure-screen.png; echo "Instrumented test suite FAILED"; exit 1; }
            adb exec-out screencap -p > out/test-artifacts/ui-test-final-screen.png
            adb pull /sdcard/Pictures/Snapedit out/test-artifacts/exported-gallery || true
            echo "=== [3/3] Verifying Produced Release APK Installation & Image Intent Launch ==="
            adb uninstall app.snapedit.test || true
            adb uninstall app.snapedit || true
            adb install -r out/Snapedit-Release.apk
            adb push assets/icon.png /sdcard/Pictures/ci_sample.png
            adb shell am broadcast -a android.intent.action.MEDIA_SCANNER_SCAN_FILE -d file:///sdcard/Pictures/ci_sample.png || true
            adb logcat -c
            adb shell am start -W -n app.snapedit/.MainActivity
            sleep 4
            [ -n "$(adb shell pidof app.snapedit)" ] && echo "Release APK is running with PID: $(adb shell pidof app.snapedit)" || { adb logcat -d *:E > out/test-artifacts/release-crash-logcat.txt; echo "Release APK crashed or failed to start"; exit 1; }
            adb exec-out screencap -p > out/test-artifacts/release-apk-launch.png

      - name: Upload Emulator Test Report & Screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Snapedit-Emulator-Test-Report
          path: out/test-artifacts/
          retention-days: 14

      - name: Upload Release APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Snapedit-Release-APK
          path: out/Snapedit-Release.apk
          retention-days: 14

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Snapedit-Debug-APK
          path: out/Snapedit-Debug.apk
          retention-days: 14

      - name: Point latest tag to current commit
        if: github.event_name != 'pull_request' && startsWith(github.ref, 'refs/tags/') != true
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -f latest ${{ github.sha }}
          git push -f origin latest || true

      - name: Create or Update GitHub Release
        if: github.event_name != 'pull_request'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'latest' }}
          name: ${{ startsWith(github.ref, 'refs/tags/') && format('Snapedit {0}', github.ref_name) || 'Snapedit (Latest Build)' }}
          body: |
            Automated build from commit ${{ github.sha }} (verified on Android Emulator CI)
            
            ### Automated Emulator Verification Passed:
            - **Image Upload & EXIF**: Synthetic photo upload to `MediaStore` + EXIF tag extraction
            - **All 43 Editing & Magic Tools**: Pixel-verified execution of every tool (`tune`, `details`, `crop`, `rotate`, `persp`, `light`, `curves`, `hsl`, `grade`, `presence`, `denoise`, `grad`, `liquify`, `brush`, `draw`, `select`, `heal`, `text`, `wb`, `sharpen`, `optics`, `radial`, `range`, `splash`, `redeye`, `tonal`, `hdr`, `glow`, `drama`, `vintage`, `grain`, `retro`, `noir`, `bw`, `blur`, `vignette`, `frames`, `neon`, `sketch`, `popart`, `drip`, `flare`, `leak`)
            - **Looks, Presets & UI Automation**: End-to-end Compose UI test across Looks, Tool categories, Edit Stack, and Gallery Export (JPEG, PNG, WebP)
            - **Release APK Smoke Test**: Installed and launched signed `Snapedit-Release.apk`
            
            ### Included Builds:
            - **Snapedit.apk** / **Snapedit-Release.apk**: Optimized signed release build (recommended for regular use).
            - **Snapedit-Debug.apk**: Debug build with full logging and debug symbols.
          files: |
            out/Snapedit-Release.apk
            out/Snapedit-Debug.apk
            out/Snapedit.apk
          prerelease: false
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
